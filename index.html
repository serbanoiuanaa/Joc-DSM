n;gap:12px;margin:22px 0 13px}h2{font-size:20px;margin:0;letter-spacing:-.5px}.tiny{font-size:12px}.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.level{border:2px solid var(--line);background:white;border-radius:22px;padding:17px;text-align:left;min-height:175px;box-shadow:0 3px 0 #f0dbe6;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:9px}.level:hover{transform:translateY(-3px);border-color:#ed9bc8}.level.completed{border-color:#c6e9d9;background:#f8fffb}.level .emoji{font-size:32px}.level strong{font-size:15px}.level small{font-size:12px;line-height:1.35;color:var(--sub)}.level .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:11px;font-weight:800;color:#c05891}.pill{border-radius:50px;padding:5px 9px;background:var(--soft)}.progress{height:10px;background:#f6e3ed;border-radius:40px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#f3a4c9,var(--pink));transition:width .3s;border-radius:40px}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);max-width:980px;width:100%;background:#fffefaee;backdrop-filter:blur(16px);border-top:1px solid #f3dce7;padding:9px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom))}

e:28px;color:#d65b9c;font-weight:900}.panel{border:1px solid var(--line);border-radius:22px;background:white;padding:20px;margin-bottom:14px}.panel h3{margin:0 0 10px}.chiprow{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #eccddd;border-radius:100px;background:#fff8fb;padding:9px 13px;font-size:12px;font-weight:800;color:#ae5989}.chip.active{background:var(--pink);border-color:var(--pink);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.library{display:grid;gap:10px}.libitem{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;text-align:left}.libitem p{margin:5px 0 0;color:var(--sub);font-size:12px}.libitem strong{font-size:15px}.case{display:inline-block;background:#fff0f7;color:#bd4e8b;padding:7px 10px;border-radius:10px;font-size:11px;font-weight:900}.notice{font-size:12px;line-height:1.55;color:#8b7988;background:#fff1f7;border:1px solid #f5deea;border-radius:14px;padding:12px;margin-top:22px}input[type=search]{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;background:white;font:inherit;outline:none}input:focus{border-color:var(--pink)}@media(max-width:530px){#app{padding:14px 14px 112px}.brand{font-size:20px}.flower{width:38px;height:38px;font-size:21px}.stat{font-size:11px;padding:7px}.statbar{gap:4px}.hero{padding:20px}.mascot{font-size:52px}.path{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.level{padding:12px;min-height:173px}.level .emoji{font-size:27px}.level strong{font-size:13px}.question-card{padding:19px}.answer{font-size:14px;padding:12px}.foot .primary{min-width:120px}}

%),#eb75b4}.level .lesson-index{grid-row:1/4}.nav .menu-toggle{gap:10px}.nav .menu-toggle .current{margin-left:auto;color:var(--sub);font-weight:800}.nav .nav-items button{justify-content:flex-start}.nav button{min-height:44px}.exit{font-size:14px;font-weight:800;padding:8px 12px;border-radius:12px;background:var(--soft)}</style></head><body><main id="app"><div style="max-width:520px;margin:56px auto;padding:28px;font-family:system-ui,sans-serif;color:#59364c;background:#fff0f7;border:2px solid #ffd1e6;border-radius:24px;text-align:center"><div class="fallback-mark" aria-hidden="true"></div><h1>ClinQuest</h1><p>Jocul are nevoie de un browser care permite JavaScript. Dacă vezi acest mesaj, deschide fișierul HTML în Safari sau Chrome, nu în previzualizarea ChatGPT ori Fișiere.</p></div></main><script>
const C=[["Neurodezvoltare","01","ADHD, TSA, dizabilitate intelectuală",[["ADHD presupune un tipar persistent de...","Neatenție și/sau hiperactivitate-impulsivitate","Doar tristețe","Doar halucinații","Doar frică socială","Simptomele au relevanță clinică atunci când afectează funcționarea."],["În evaluarea ADHD este important să investighezi...","Debutul în perioada dezvoltării și mai multe contexte","Exclusiv comportamentul din cabinet","Doar rezultatul unui test IQ","Doar consumul de cafea","Informația din contexte diferite ajută la evaluarea persistenței simptomelor."],["TSA este caracterizată în principal prin...","Dificultăți de comunicare/interacțiune socială și comportamente restrictive/repetitive","Numai deficite de memorie","Exclusiv dispoziție depresivă","Numai atacuri de panică","Manifestările și nevoile de sprijin sunt variabile."],["Dizabilitatea intelectuală implică dificultăți în...","Funcționarea intelectuală și adaptativă","Exclusiv viteza de citire","Doar reglarea somnului","Doar interacțiunea cu străinii","Evaluarea funcționării adaptative este esențială, nu doar un scor cognitiv."],["ADHD și TSA...","Pot coexista","Se exclud automat","Au criterii identice","Sunt întotdeauna temporare","Comorbiditatea este posibilă și trebuie evaluată distinct."]]],["Spectrul schizofreniei","02","Psihoză, simptome pozitive și negative",[["Care este un simptom psihotic pozitiv?","Halucinațiile","Aplatizarea afectivă","Avolitia","Alogia","Pozitiv înseamnă apariția unei experiențe sau manifestări suplimentare."],["Care este un simptom negativ?","Avolitia","Delirul","Halucinațiile auditive","Gândirea dezorganizată","Avolitia se referă la diminuarea motivației și inițiativei."],["O idee delirantă este...","O convingere fixă care nu se modifică ușor în fața dovezilor contrare","Orice gând neplăcut","O amintire intensă","O preocupare financiară","Conținutul trebuie interpretat în context cultural și clinic."],["Halucinația este...","O experiență perceptivă fără stimul extern corespunzător","O opinie exagerată","Un gând intruziv recunoscut","O imagine voluntară","Nu orice experiență perceptivă neobișnuită indică schizofrenie."],["Pentru diferențierea tulburărilor psihotice contează...","Durata, simptomele afective și cauzele posibile","Doar numărul de prieteni","Doar vârsta","Doar un singur simptom","Evaluarea diferențială include substanțe și afecțiuni medicale."]]],["Bipolaritate","03","Manie, hipomanie și depresie",[["Ce diferențiază fundamental mania de hipomanie?","Severitatea afectării și posibilitatea spitalizării sau psihozei","Culoarea dispoziției","Prezența obligatorie a tristeții","Ora zilei","Hipomania nu produce afectarea marcată definitorie pentru manie."],["Într-un episod maniacal poate apărea...","Nevoia redusă de somn, cu energie crescută","Somnolență exclusivă","Alogie izolată","Amnezie globală","Persoana poate dormi puțin fără să resimtă oboseala obișnuită."],["Tulburarea bipolară I necesită în istoric...","Cel puțin un episod maniacal","Obligatoriu trei episoade depresive","Exclusiv episoade hipomaniacale","Numai ciclotimie","Episodul depresiv major este frecvent, dar nu obligatoriu pentru bipolar I."],["Tulburarea bipolară II include...","Hipomanie și episoade depresive majore, fără manie","Manie fără depresie","Psihoză permanentă","Doar instabilitate zilnică","Diferența față de bipolar I nu este doar intensitatea depresiei."],["Ciclotimia implică...","Oscilații persistente cu simptome sub pragul episoadelor complete","Exclusiv atacuri de panică","Doar depresie majoră","Un singur episod maniacal","Nu se echivalează automat cu tulburarea bipolară I sau II."]]],["Tulburări depresive","04","Episod depresiv, distimie, DMDD",[["Un simptom central al episodului depresiv major este...","Dispoziția depresivă sau pierderea interesului/plăcerii","Delirul obligatoriu","Euforia permanentă","Compulsiile obligatorii","Se evaluează și durata, numărul simptomelor și afectarea funcțională."],["Durata minimă tipică a episodului depresiv major este...","Două săptămâni","Două ore","Trei zile","Un an","Simpla tristețe de două săptămâni nu este suficientă pentru diagnostic."],["Tulburarea depresivă persistentă la adult presupune dispoziție depresivă...","De cel puțin doi ani","Exact două zile","Doar după un traumatism","Numai în sezonul rece","Se analizează intervalele fără simptome și ceilalți indicatori diagnostici."],["În evaluarea depresiei este importantă...","Explorarea ideației suicidare și a siguranței","Evitarea oricărei întrebări de risc","Folosirea unui singur chestionar","Ignorarea somnului","Evaluarea riscului se realizează direct, contextual și clinic."],["În diferențierea depresiei unipolare de bipolaritate verificăm...","Istoricul de manie sau hipomanie","Doar apetitul","Doar ocupația","Numai sezonul nașterii","Un episod depresiv poate apărea în mai multe tulburări."]]],["Tulburări anxioase","05","Panică, fobii, anxietate socială, GAD",[["Atacul de panică este...","O creștere bruscă a fricii/disconfortului intens, cu simptome multiple","O îngrijorare constantă de ani","O halucinație","Un ritual repetitiv","Atacurile de panică pot apărea în mai multe diagnostice."],["Agorafobia implică teama de...","Situații în care scăparea sau ajutorul ar putea fi dificile","Exclusiv insecte","Doar evaluarea negativă","Numai contaminare","Se pot evita transportul public, mulțimile ori ieșitul singur."],["În anxietatea socială, tema centrală este...","Posibila evaluare negativă de către ceilalți","Pierderea memoriei","Euforia necontrolată","Ritualuri motorii","Este diferită de preferința pentru solitudine."],["Tulburarea anxioasă generalizată presupune...","Îngrijorare excesivă, greu de controlat, în mai multe domenii","Doar o fobie specifică","Numai un atac de panică","Doar compulsii","Se evaluează durata, simptomele asociate și afectarea."],["Fobia specifică se referă la...","Frică marcată față de un obiect sau o situație particulară","Orice tristețe","Doar grijile legate de viitor","Lipsa mot de cafea","Este un sindrom care necesită evaluare atentă și adesea urgentă."],["Un semn catatonic posibil este...","Stupoarea sau flexibilitatea ceroasă","Doar îngrijorarea","Doar tristețea","Exclusiv insomnie","Manifestările catatonice sunt diverse."],["Simptomele induse de medicație...","Trebuie diferențiate de tulburările primare","Sunt întotdeauna simulate","Nu influențează evaluarea","Sunt exclusiv depresive","Istoricul de tratament este important."],["Factorii psihosociali și de mediu...","Pot fi relevanți pentru evaluare fără a fi ei înșiși diagnostice","Sunt totdeauna tulburări","Nu trebuie înregistrați","Exclud tulburările psihice","Contextul poate explica sau agrava dificultățile."],["În orice evaluare DSM...","Diagnosticul diferențial și impactul funcțional contează","Un singur simptom e suficient","Nu există comorbidități","Interviul e inutil","Clasificarea sprijină judecata clinică; nu o înlocuiește."]]],["Diferențial: panică vs GAD","21","Viniete și raționament clinic",[["O persoană are episoade bruște cu palpitații și teamă intensă. Ce explorăm întâi?","Caracteristicile atacurilor, recurența și îngrijorarea ulterioară","Diagnostic automat de panică","Doar IQ","Exclusiv istoricul familial","Atacul de panică nu este echivalent automat cu tulburarea de panică."],["O persoană se îngrijorează persistent despre muncă, familie și sănătate. Ce ipoteză explorăm?","Tulburare anxioasă generalizată","Schizofrenie automat","Tulburare de conduită","Encoprezis","Verificăm durata, dificultatea controlului și simptomele asociate."],["Teama apare aproape doar când persoana vorbește în public. Ce explorăm?","Anxietate socială","Tulburare de consum","Delirium","Ciclotimie","Se verifică frica de evaluare negativă și afectarea."],["O persoană evită metroul de teamă că nu poate ieși la nevoie. Ce explorăm?","Agorafobie","TOC automat","Derealizare izolată","Anorexie","Teama de imposibilitatea de a scăpa/obține ajutor e centrală."],["O persoană își verifică repetat aragazul pentru a neutraliza un gând intruziv. Ce explorăm?","Obsesii și compulsii","Doar anxietate socială","Doar manie","Tulburare neurocognitivă majoră","Relația dintre intruziune și ritual este relevantă."]]],["Diferențial: dispoziție","22","Depresie, bipolaritate, adaptare",[["Persoana descrie perioade cu somn foarte puțin, energie neobișnuită și impulsivitate. Ce întrebi?","Durata, afectarea și alte simptome de (hipo)manie","Doar apetitul","Doar preferința muzicală","Exclusiv somnolența","Este importantă explorarea istoricului afectiv longitudinal."],["O persoană are tristețe după pierdere. Care e abordarea corectă?","Evaluarea contextuală a simptomelor, duratei și impactului","Diagnostic automat de depresie","Ignorarea suferinței","Presupunerea unei manii","Reacțiile de doliu și depresia pot semăna, dar nu sunt automat identice."],["Un pacient relatează anhedonie, insomnie și idei de inutilitate. Ce e prioritar?","Evaluarea riscului și a simptomelor depresive complete","Doar un test de inteligență","Să presupui bipolar I","Să ignori funcționarea","Siguranța și anamneza completă sunt esențiale."],["Schimbare recentă de job, suferință semnificativă, fără suficiente simptome pentru altă tulburare. Ce explorezi?","Tulburare de adaptare","Schizofrenie sigură","Narcolepsie","Disforie de gen","Contează relația cu stresorul și diagnosticul diferențial."],["Episod depresiv plus istoric clar de manie: ce ipoteză devine importantă?","Tulburare bipolară I","Depresie unipolară obligatorie","Fobie specifică","TOC izolat","Istoricul de manie schimbă încadrarea diagnostică."]]]];
const KEY='clinquest_pink_v2';
let state={xp:0,done:{},mistakes:[],streak:0,lastDay:'',history:[]};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
let screen='home',lesson=null,deck=[],idx=0,chosen=null,checked=false,hearts=5,correctCount=0,reviewMode=false,searchText='',modeFilter='all',menuOpen=false;
const app=document.querySelector('#app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function adjustStreak(){let d=today();if(state.lastDay===d)return;let p=new Date();p.setDate(p.getDate()-1);let yesterday=p.getFullYear()+'-'+String(p.getMonth()+1).padStart(2,'0')+'-'+String(p.getDate()).padStart(2,'0');state.streak=state.lastDay===yesterday?state.streak+1:1;state.lastDay=d}
const NAV=[['home','Acasă'],['path','Lecții'],['review','Repetă'],['profile','Progres']];
function nav(){const cur=NAV.find(n=>n[0]===screen)||NAV[0];return `<nav class="nav${menuOpen?' open':''}" aria-label="Navigare principală"><button class="menu-toggle" data-menu="1" aria-expanded="${menuOpen}" aria-controls="nav-items"><span>Meniu</span><span class="current">${cur[1]}</span></button><div class="nav-items" id="nav-items">${NAV.map(n=>`<button class="${screen===n[0]?'selected':''}" data-nav="${n[0]}"${screen===n[0]?' aria-current="page"':''}>${n[1]}</button>`).join('')}</div></nav>`}
function setMenu(open,focusToggle){menuOpen=open;const n=document.querySelector('.nav');if(!n)return;n.classList.toggle('open',open);const t=n.querySelector('.menu-toggle');t.setAttribute('aria-expanded',open);if(focusToggle)t.focus()}
function topBar(){return `<header class="top"><div class="brand"><span class="flower" aria-hidden="true"></span> ClinQuest<span style="color:#dd73ae">.</span></div><div class="statbar"><span class="stat">Serie ${state.streak}</span><span class="stat">${state.xp} XP</span></div></header>`}
function totalDone(){return Object.values(state.done).filter(Boolean).length}
function overview(){let percent=Math.round(100*totalDone()/C.length);return `<section class="hero"><div><div class="eyebrow">Învață psihopatologie prin joacă</div><h1>Puțin în fiecare zi.<br/>Mult mai clar în cabinet.</h1><p>5 întrebări pe lecție • feedback pe loc • recapitulări adaptate greșelilor</p><div style="margin-top:17px"><button class="primary" data-start="${nextLevel()}">Continuă să înveți →</button></div></div><div class="mascot"><strong>DSM-5</strong><span>22 de lecții</span></div></section><div class="panel"><div class="row"><b>Traseul tău de învățare</b><span class="muted tiny">${totalDone()}/${C.length} lecții</span></div><div class="progress" style="margin-top:12px"><div style="width:${percent}%"></div></div></div>`}
function nextLevel(){let n=C.findIndex((_,i)=>!state.done[i]);return n<0?0:n}
function renderHome(){return overview()+`<div class="title-row"><h2>Începe de aici</h2><span class="muted tiny">Capitole DSM-5</span></div>`+pathCards(C.slice(0,6),0)+`<div class="title-row"><h2>Un pic de practică clinică?</h2></div><div class="panel"><div class="row"><div><b>Mini-viniete și diferențial</b><p class="muted tiny">Testează-ți raționamentul, nu doar memoria.</p></div><button class="secondary" data-start="18">Joacă →</button></div></div>`+notice()}
function pathCards(arr,offset){return `<div class="path">${arr.map((c,j)=>{const i=offset+j;return `<button class="level ${state.done[i]?'completed':''}" data-start="${i}"><span class="lesson-index" aria-hidden="true">${c[1]}</span><strong>${i+1}. ${escapeHtml(c[0])}</strong><small>${escapeHtml(c[2])}</small><span class="bottom"><span>${state.done[i]?' Completat':'5 provocări'}</span><span class="pill">${state.done[i]?'Repetă':'+50 XP'}</span></span></button>`}).join('')}</div>`}
function renderPath(){return `<div class="title-row"><div><div class="eyebrow">Traseul complet</div><h2>22 de lecții • 110 întrebări</h2></div></div><p class="muted">Poți juca în orice ordine. Capitolele acoperă principalele familii de tulburări și două module clinice.</p>`+pathCards(C,0)+notice()}
function notice(){return `<div class="notice"><b>Notă profesională:</b> Aplicația este un instrument de învățare cu explicații originale, nu textul integral DSM și nu un instrument de diagnostic. Conținutul introductiv trebuie confruntat cu criteriile, specificatorii, pragurile și excluderile din manual; PDF-ul DSM-5 disponibil este scanat și nu a fost verificat integral pentru fiecare item. Nu conține cazuri reale de clienți.</div>`}
function renderReview(){let number=state.mistakes.length;return `<div class="eyebrow">Recapitulare activă</div><h2 style="margin:8px 0 16px">Greșelile devin lecții.</h2><div class="panel"><h3>${number} întrebări de reluat</h3><p class="muted">Orice răspuns greșit intră automat în colecția de recapitulări. Răspunsurile corecte ies din colecție după repetare.</p><button class="primary" data-review="1" ${number?'':'disabled'}>${number?'Încep recapitularea':'Nimic de repetat încă'}</button></div><div class="panel"><h3>Provocarea rapidă</h3><p class="muted">Joacă o lecție aleasă din traseu.</p><button class="secondary" data-random="1">Alege-mi una →</button></div>`}
function renderProfile(){return `<div class="eyebrow">Evoluția ta</div><h2 style="margin:8px 0 17px">Un pic mai bună în fiecare zi.</h2><div class="path stats"><div class="panel"><span class="metric-label">XP</span><div class="resultnum">${state.xp}</div><b>XP câștigate</b></div><div class="panel"><span class="metric-label">Serie</span><div class="resultnum">${state.streak}</div><b>Zile consecutive</b></div><div class="panel"><span class="metric-label">Lecții</span><div class="resultnum">${totalDone()}</div><b>Lecții completate</b></div><div class="panel"><span class="metric-label">Repetă</span><div class="resultnum">${state.mistakes.length}</div><b>De repetat</b></div></div><div class="panel"><h3>Insigne</h3><div class="chiprow"><span class="chip ${state.xp>=10?'active':''}">Prima întrebare</span><span class="chip ${totalDone()>=1?'active':''}">Prima lecție</span><span class="chip ${state.xp>=200?'active':''}">200 XP</span><span class="chip ${totalDone()>=10?'active':''}">10 lecții</span></div></div><div class="panel"><h3>Datele tale</h3><p class="muted tiny">Progresul este salvat numai în acest browser, pe dispozitivul acesta. Ștergerea datelor browserului îl poate elimina.</p><button class="secondary" data-reset="1">Resetează progresul</button></div>`}
function startLesson(n){lesson=+n;deck=C[lesson][3].map((q,i)=>({q,id:lesson+'-'+i}));launch(false)}
function launch(review){reviewMode=review;idx=0;chosen=null;checked=false;hearts=5;correctCount=0;screen='game';render()}
function startReview(){if(!state.mistakes.length)return;lesson=null;deck=state.mistakes.map(id=>{let [a,b]=id.split('-').map(Number);return {q:C[a][3][b],id}}).slice(0,15);launch(true)}
function renderGame(){const obj=deck[idx],q=obj.q;if(!q)return renderEnd();let opts=[q[1],q[2],q[3],q[4]];let shift=(idx*3+(lesson||0))%4;opts=[...opts.slice(shift),...opts.slice(0,shift)];let correct=chosen===q[1];return `<div class="game"><div class="gamebar"><button class="exit" data-exit="1" title="Ieși">Ieși</button><div class="progress"><div style="width:${(idx/deck.length)*100}%"></div></div><span class="hearts">Vieți: ${hearts}</span></div><div class="question-card"><div class="qtag">${reviewMode?'Recapitulare':escapeHtml(C[lesson][0])} · ${idx+1}/${deck.length}</div><h1>${escapeHtml(q[0])}</h1><div class="answers">${opts.map((o,i)=>`<button class="answer ${checked&&o===q[1]?'right':''} ${checked&&o===chosen&&o!==q[1]?'wrong':''} ${!checked&&chosen===o?'chosen':''}" data-answer="${escapeHtml(o)}" ${checked?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(o)}</span></button>`).join('')}</div>${checked?`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'Corect!':'Nu chiar. Uite de ce:'}</strong><p><b>Răspuns:</b> ${escapeHtml(q[1])}</p><p>${escapeHtml(q[5])}</p></div>`:''}</div><div class="foot"><span class="muted tiny">${checked?'Înveți și când greșești.':'Alege un răspuns.'}</span><button class="primary" data-next="1" ${chosen===null?'disabled style="opacity:.45"':''}>${checked?(idx===deck.length-1||hearts===0?'Rezultate →':'Continuă →'):'Verifică →'}</button></div></div>`}
function checkAnswer(){let obj=deck[idx];checked=true;let ok=chosen===obj.q[1];if(ok){correctCount++;state.xp+=10;state.mistakes=state.mistakes.filter(x=>x!==obj.id)}else{hearts--;if(!state.mistakes.includes(obj.id))state.mistakes.push(obj.id)}save()}
function next(){if(!checked){if(chosen===null)return;checkAnswer();render();return}idx++;chosen=null;checked=false;if(idx>=deck.length||hearts===0){screen='end';if(!reviewMode&&hearts>0){state.done[lesson]=true;adjustStreak();save()}}render()}
function renderEnd(){let win=hearts>0;return `<div class="game"><div class="result"><div class="resultmark">${win?'Lecție încheiată':'Mai încearcă'}</div><div class="eyebrow">${win?'Rezultat':'Ai rămas fără vieți'}</div><h1>${win?'Ai făcut treabă bună!':'Mai încercăm o dată?'}</h1><p class="muted">${correctCount} răspunsuri corecte din ${Math.min(idx,deck.length)} întrebări parcurse.</p><div class="resultnum">+${correctCount*10} XP</div><p class="muted">${state.mistakes.length} întrebări în colecția de repetat</p><div class="chiprow" style="justify-content:center;margin-top:22px"><button class="secondary" data-home="1">Acasă</button><button class="primary" data-retry="1">${reviewMode?'Repetă':'Joacă din nou'} →</button></div></div></div>`}
function render(){menuOpen=false;app.innerHTML=(screen==='game'?renderGame():screen==='end'?renderEnd():topBar()+(screen==='path'?renderPath():screen==='review'?renderReview():screen==='profile'?renderProfile():renderHome())+nav());document.title='ClinQuest — DSM Study'}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(menuOpen&&!e.target.closest('.nav'))setMenu(false);if(!b)return;if(b.hasAttribute('data-menu')){setMenu(!menuOpen)}else if(b.hasAttribute('data-nav')){screen=b.dataset.nav;render();window.scrollTo(0,0)}else if(b.hasAttribute('data-start')){startLesson(b.dataset.start);window.scrollTo(0,0)}else if(b.hasAttribute('data-answer')){if(!checked){chosen=b.dataset.answer;render()}}else if(b.hasAttribute('data-next')){next()}else if(b.hasAttribute('data-exit')){screen='path';render()}else if(b.hasAttribute('data-review')){startReview()}else if(b.hasAttribute('data-random')){startLesson(Math.floor(Math.random()*C.length))}else if(b.hasAttribute('data-home')){screen='home';render()}else if(b.hasAttribute('data-retry')){if(reviewMode)startReview();else startLesson(lesson)}else if(b.hasAttribute('data-reset')){if(confirm('Ștergi definitiv progresul din acest browser?')){localStorage.removeItem(KEY);state={xp:0,done:{},mistakes:[],streak:0,lastDay:'',history:[]};render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen)setMenu(false,true)});
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script></body></html>
